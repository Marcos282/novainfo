{% extends 'base.html' %}

{% block title %}Login | Nova Info{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card">
      <div class="auth-header text-center">
        <span class="eyebrow dark">Painel administrativo</span>
        <h1>Entrar na Nova Info</h1>
      </div>

      <form method="post" class="mt-4">
        {% csrf_token %}
        {% if form.non_field_errors %}
          <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}

        <div class="mb-3">
          <label for="id_username" class="form-label">Usuário</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label for="id_password" class="form-label">Senha</label>
          {{ form.password }}
        </div>

        <button type="submit" class="btn btn-primary w-100 rounded-pill">Entrar</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
